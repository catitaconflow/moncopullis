# Prueba de carga (R1): tres corridas seguidas desde un runner de GitHub, para comparar su estabilidad.
name: carga

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        corrida: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Corrida ${{ matrix.corrida }}
        run: k6 run --summary-export resumen-${{ matrix.corrida }}.json pruebas/carga/carga.k6.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carga-${{ matrix.corrida }}
          path: resumen-${{ matrix.corrida }}.json
